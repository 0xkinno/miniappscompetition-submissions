builder_story: "I've been doing game development for almost 3 years, and I love
  web3 games as a player too — that's what made the cheating problem stand out
  to me: in most \"score = money\" games, the client claims a score and the
  backend just takes its word for it. Fixing that structurally is the actual
  core of NimJump — everything else is built around it. The client has zero
  authority: it only records raw inputs. The server replays those inputs itself
  and only trusts its own recomputed result — if it doesn't match exactly, the
  run is rejected. Every reward (leaderboard rank, quests, coin conversion) is
  granted purely off that server-side result.\r

  \r

  There's also a reward-farming guard: every NIM claim is checked per-IP, max 2
  wallets paid per IP per day, so throwaway accounts on one connection don't
  work.\r

  \r

  Recording inputs instead of video also compresses well — a full minute of
  typical play is around 200 bytes, so under 1GB holds well over 5 million
  replayable runs. I never have to throw anything away — every leaderboard score
  has its real replay behind it.\r

  \r

  Built in Godot 4.7, with tap or gyroscope tilt controls both supported.\r

  \r

  For retention: a daily login streak, daily/weekly leaderboard resets, and
  daily quests give players a reason to come back each day instead of playing
  once.\r

  \r

  One of the newer additions is VS mode — 1v1 wagered challenges where two
  players stake NIM, play the same seed, and the higher score takes the pot. It
  gives NIM real in-game utility (circulating between players, not just paid out
  one-way), and it turned into an organic growth loop — players stake and send
  the challenge link directly to friends, pulling new people in through invites
  instead of ads. Same anti-cheat guarantee applies: both replays are
  server-verified before payout.\r

  \r

  I've been building NimJump since the competition was announced — about a month
  — and it's been running publicly that whole time, not just tested privately.
  In the first week, 15 different real users found and played it — by the most
  recent week, that had grown to a total of 28 users. Full stats published
  here:\r

  https://www.skool.com/miniappscompetition/nimjump-release\r

  https://www.skool.com/miniappscompetition/nimjump-update\r

  https://www.skool.com/miniappscompetition/nimjump-stats-update-last-post-befo\
  re-competition"
