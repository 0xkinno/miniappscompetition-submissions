app_name: NimJump
category: Games
tagline: Solving one of web3 gaming's biggest problems — cheating — wrapped in a
  game actually worth playing.
description: "NimJump is an endless vertical platformer game for Nimiq — jump,
  dodge, and climb as high as you can with tap or gyro-tilt controls. Every run
  is verified server-side: the client only sends its inputs, the backend replays
  the match itself, and only pays out if the replay matches"
