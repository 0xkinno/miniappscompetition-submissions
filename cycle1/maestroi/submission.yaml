app_name: NimConnect
category: Social
tagline: Human-friendly crypto starts here.
description: Nimiq wallets identify you by a 44-character address — hard to
  remember, awkward to share, impossible to build anything social around.
  NimConnect fixes that. Claim a permanent @handle, get a public profile, and
  use it to send, request, split, and tip NIM with people instead of strings.
  Contacts, shared trip buckets, and a handle marketplace round it out — and
  any Nimiq Mini App can plug into the same identity via the open
  profile-client package.
