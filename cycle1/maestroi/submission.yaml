builder_story: Every Mini App I tried re-solved "who is this wallet" from
  scratch, and users paid the tax of memorizing addresses. I wanted an
  identity layer other apps could reuse, not another silo. NimConnect answers
  four questions in one place — who am I (on-chain @handles, public
  profiles), who do I know (private, local-first contacts), how do we pay
  (send, request, split, tip), and how do we save together (shared trip
  buckets). Handles are ownable, so I built a marketplace to trade them with
  escrow-backed trades. Private data — notes, tags, contact history — never
  leaves the device; only what you choose to publish does. The whole thing
  ships as a reusable TypeScript client, so the next Mini App doesn't
  reinvent identity — it just resolves an @handle.
