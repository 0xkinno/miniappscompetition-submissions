builder_story: "I kept quitting the things I cared about — the gym, the writing,
  the early mornings — not because I couldn't, but because nothing was on the
  line and no one was watching. Habit apps try to fix that with streaks,
  notifications, and lately AI that literally watches you. That always felt like
  the wrong answer: surveillance, not trust.\r

  \r

  Stakes is the opposite. You put a little real money on a goal and you do it
  with your friends — the people whose opinion actually moves you. Your crew
  keeps you honest, not an algorithm. And because it runs on Nimiq Pay, the
  money moves instantly and gaslessly, so it feels less like crypto and more
  like a bet between friends. That's the whole idea: make follow-through feel
  social, real, and a little bit at stake."
