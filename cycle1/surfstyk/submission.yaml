tagline: Put your money where your mouth is — with your crew.
description: "A social commitment game where you stake a little NIM on a weekly
  goal and your friends keep you honest: check in daily and get it all back plus
  a bonus, or forfeit a slice for every day you miss. For anyone who's ever quit
  a good habit and wished the stakes were real."
