builder_story: I built Tab to make group payments effortless. Splitting
  restaurant bills is often slow and awkward, especially when everyone needs to
  calculate amounts or deal with transfer fees. Tab uses Nimiq's instant,
  feeless payments to generate payment requests for each participant, making it
  easy to collect everyone's share in seconds. The goal was to create a simple
  social payment experience that feels seamless and encourages real-world crypto
  usage.
