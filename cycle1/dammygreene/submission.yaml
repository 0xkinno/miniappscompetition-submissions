builder_story: "Like many people, I've lost count of how many times friends have
  said, \"I bet you're wrong,\" only for everyone to forget about it later.
  Whether it's crypto price predictions, football matches, or friendly
  challenges, there's never been a simple way to turn those moments into
  something transparent and fun.\r

  \r

  That's what inspired Nimiq Pools. I wanted to build a lightweight social
  prediction platform where anyone can create a prediction pool, stake NIM, and
  have the outcome resolved fairly, either automatically from trusted data
  sources or by the community itself.\r

  \r

  Nimiq's feeless payments and Mini App ecosystem made it possible to create an
  experience where even small prediction pools feel instant and practical. My
  goal wasn't to build another betting app, but to make friendly predictions
  easy to create, easy to settle, and accessible to everyone inside Nimiq Pay."
