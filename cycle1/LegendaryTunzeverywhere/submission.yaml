builder_story: "A few months ago, I found myself in a situation that many crypto
  users can relate to. I was completely out of cash, but I had cryptocurrency
  that I had been saving. I urgently needed to buy mobile data to stay
  connected, yet the platforms available either didn't support what I had or
  imposed limits that made it impossible to use directly.\r

  \r

  To get something as simple as airtime, I had to sell my crypto, swap it for
  USDT, transfer it to another platform, and then finally purchase my data. By
  the time I was done, I had lost money to trading and network fees all just to
  buy something that should have taken seconds.\r

  \r

  That experience made me realize that cryptocurrency still isn't as practical
  as it should be for everyday life.\r

  \r

  That's why I built NimAgent. The vision evolved into something much bigger: an
  AI-powered payment assistant that lets people use their NIM for real-world
  needs without unnecessary complexity. Whether it's buying airtime, purchasing
  gift cards, or paying utility bills, NimAgent bridges the gap between the
  Nimiq ecosystem and everyday digital services, making cryptocurrency genuinely
  useful when it matters most.\r

  \r

  Building a product backed by blockchain has always been a personal ambition of
  mine, not just to launch another crypto application but to solve a problem I
  experienced firsthand. That experience gave me a clear purpose, and it
  continues to drive every decision I make while building NimAgent. I'm
  committed to creating a product that people genuinely rely on, and this
  competition is an opportunity to prove that a simple idea, built around real
  user needs, can have meaningful impact."
