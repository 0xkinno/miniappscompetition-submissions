builder_story: "As someone working to improve my savings habits and build real
  financial independence, I wanted a pocket-friendly piggy bank fit for the
  digital, onchain age. I wanted a place to save my USDT with ease — no KYC, no
  bank accounts, no friction. Somewhere I could save as I earn.\r

  \r

  So I built Piggy: my onchain piggy bank, inside Nimiq Pay.\r

  \r

  We built Piggy to help anyone develop a strong savings culture. Deposit USDT
  into your vault and optionally earn yield on top. Need cash in an emergency?
  Borrow against your savings without breaking your vault. To make saving stick,
  we added Save-with-Frens challenges — join or create challenges like “save $10
  every day” and build streaks together. And to help you hit real goals, set
  targeted vaults for a vacation, a new laptop, or anything else.\r

  \r

  No bank apps. No KYC delays. Just your wallet, your vault, and your goals."
