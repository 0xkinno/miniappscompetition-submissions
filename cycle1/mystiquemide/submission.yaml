builder_story: "Every time I onboard to a new chain, the learning is read-only.
  I skim a docs page, nod, and close the tab with nothing to show I understood
  any of it. Quizzes that live in the browser are worse, the answers ship in the
  page and you can cheat in five seconds.\r

  \r

  So I built the opposite. You pass a quiz that is graded on the server, then
  you sign a one-time message with the wallet you actually control. The receipt
  is the proof. The real receipt so far: one Meet Nimiq completion signed inside
  Nimiq Pay on an iPhone, stored in D1, visible on the live leaderboard. No NIM
  moved."
