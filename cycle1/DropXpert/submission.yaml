app_name: XcrowHub
category: Marketplaces
tagline: Create the deal. Protect the payment. Deliver with confidence.
description: XcrowHub is a Nimiq Pay escrow marketplace for freelancers, digital
  sellers, and buyers. It turns NIM or USDT payments into structured deals with
  delivery terms, proof, confirmation, refunds, disputes, QR links, bidding, and
  transparent settlement.
