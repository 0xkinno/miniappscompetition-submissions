builder_story: "Crypto payments are fast, but online peer-to-peer deals still
  depend heavily on trust. Buyers worry about paying before delivery, while
  sellers worry about completing work without payment assurance. I built
  XcrowHub to turn Nimiq-powered payments into a practical escrow workflow for
  real products and services.\r

  XcrowHub launched as a Nimiq Pay Mini App and quickly expanded to support
  private deals, marketplace listings, bidding, payment verification, delivery
  confirmation, referrals, support, and dispute handling. I also introduced a
  dedicated desktop experience so users can manage longer workflows outside the
  mobile app.\r

  Within eight days of launch, XcrowHub onboarded more than 160 users, recorded
  over 200 transactions on the Nimiq blockchain, and reached more than 12 live
  marketplace products. I also committed 400,000 NIM to an AuthideX growth
  campaign because distribution is as important as development.\r

  Next, I plan to introduce a hiring marketplace for brands and freelancers,
  milestone-based payments, in-app asset swaps, and broader asset support
  through wallet integrations and the Nimiq Pay SDK. My goal is to make Nimiq
  useful for everyday commerce, not only transfers."
