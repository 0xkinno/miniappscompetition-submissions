builder_story: "It started with a forgotten birthday. Not the kind where you
  forget to buy a cake  the kind where you find a voice note from someone you
  lost, buried in an old phone, dated the day before your birthday. They'd
  recorded it months in advance, knowing they might not be around. But the phone
  died. \r

  \r

  The note was never heard. The moment passed. That hit different. We sat with
  that for a while. And then the question wouldn't leave us alone:  What if
  there was a way to make sure a message always arrives  no matter what? A way
  to seal something today and guarantee it opens tomorrow, next year, or ten
  years from now. Not stored in a phone that breaks. Not lost in a cloud folder
  no one checks. But locked, waiting, and delivered exactly when it's supposed
  to be. That's where NimCapsule was born. \r

  \r

  \ Why Time Capsules? Why Now? We live in an age of instant everything. Instant
  messages, instant reactions, instant gratification. But the most powerful
  moments in life aren't instant  they're the ones that arrive with weight. A
  letter you wrote a year ago. A photo from a night you almost forgot. A gift
  that shows up on a day when someone needs it most. We wanted to build
  something that brought intention back to how we communicate. Not another
  messaging app. Not another social feed. Something slower. Something
  deliberate. Something that says: I thought about you not just right now, but
  months ago, when I sealed this for you. \r

  \r

  Why Crypto? Why NIM? We could have stopped at messages and photos. But we kept
  asking: *What if a capsule could carry real value?* Imagine opening a time
  capsule on your 18th birthday and finding not just a letter from your parents
  but a crypto gift they locked away years ago. That's not just sentiment.
  That's someone investing in your future, literally. Nimiq made this possible.
  It's lightweight, browser-native, and built for exactly this kind of seamless,
  human-first experience. \r

  \r

  No complicated wallet setups. No gas fee headaches. Just connect, attach, and
  seal.What We Believe We believe memories deserve more than a camera roll. We
  believe some words are meant to arrive later. We believe gifts carry more
  meaning when they're tied to a moment in time. NimCapsule isn't just an app.
  It's a promise that the things you care about today will still find their way
  to the people who matter, exactly when they're meant to. **We're not building
  for likes. We're building for the moments that actually matter."
