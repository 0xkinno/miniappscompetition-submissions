builder_story: "I grew up watching my mum run a \"cooperative\" with her market
  trader friends. Every Friday, nine women pooled their week and one person
  walked away with enough to restock, pay school fees, or fix something that had
  been broken for months. It worked because they all lived on the same street
  and could find each other.\r

  \r

  The same practice exists in Nigeria as \"ajo,\" in Ghana as \"susu,\" across
  West Africa, South Asia, and Latin America under dozens of names. Hundreds of
  millions of people use it. None of them have a way to do it with someone they
  met online, or someone who moved to another city.\r

  I built Kolo because the coordination problem is solved. Nimiq handles the
  trust. The memo field on every transaction is the receipt your mum's friends
  never had."
