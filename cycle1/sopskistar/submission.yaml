builder_story: "EverRelay Mini was inspired by a simple question: if something
  unexpected happened today, would our families know how to recover or manage
  our digital lives?\r

  \r

  As more of our finances, identities, insurance information, and digital assets
  move online and on-chain, most people focus on protecting their wallets but
  rarely prepare for emergencies, incapacity, or family handover. Important
  insurance contacts, recovery plans, trusted contacts, and critical documents
  are often scattered or never organized until it's too late.\r

  \r

  We built EverRelay Mini to help users assess their digital continuity without
  taking custody of their wallets or collecting sensitive information. By
  combining secure Nimiq wallet connectivity with practical readiness
  assessments across wallet recovery, emergency contacts, insurance readiness,
  digital assets, documentation, and security practices, EverRelay Mini gives
  users a clear action plan to strengthen their preparedness before an emergency
  happens."
