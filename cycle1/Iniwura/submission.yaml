builder_story: "I kept seeing the same problem everywhere:\r

  \ freelance platforms make you trust a client's word, or trust a platform's
  dispute team, before any money is real. Pull inverts that. The buyer locks
  real NIM on-chain before anyone even claims the job, so trust isn't a promise,
  it's a balance you can check yourself. I built the whole escrow, chat, and
  reputation system from scratch on native NIM, using the Mini Apps SDK, because
  I wanted the payment rail to be the actual product"
